<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="parallel-title parallel-desc">
  <title id="parallel-title">Mode 2 Parallel Flow</title>
  <desc id="parallel-desc">Claude and Codex analyze in parallel, share findings, cross-challenge each other, merge findings, and produce consensus unless unresolved issues go to Owner.</desc>
  <defs>
    <filter id="parallel-soft-shadow" x="-18%" y="-25%" width="136%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <radialGradient id="parallel-hub-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <marker id="parallel-arrow-slate" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="parallel-arrow-red" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <rect x="1" y="1" width="718" height="398" rx="24" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="88" y="90" width="208" height="156" rx="28" fill="#eef2ff" stroke="#e0e7ff"/>
  <rect x="424" y="90" width="208" height="156" rx="28" fill="#ecfeff" stroke="#cffafe"/>
  <text x="192" y="112" text-anchor="middle" class="label" font-size="11" font-weight="800" fill="#4f46e5">Claude lane</text>
  <text x="528" y="112" text-anchor="middle" class="label" font-size="11" font-weight="800" fill="#0891b2">Codex lane</text>

  <path d="M360 68 C310 88 246 96 192 122" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <path d="M360 68 C410 88 474 96 528 122" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>

  <g filter="url(#parallel-soft-shadow)">
    <rect x="268" y="24" width="184" height="44" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="360" y="52" text-anchor="middle" class="label" font-size="14" font-weight="800" fill="#334155">Task: design / audit</text>
  </g>

  <g filter="url(#parallel-soft-shadow)">
    <rect x="126" y="122" width="132" height="44" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="192" y="150" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#3730a3">Analyze</text>
  </g>
  <path d="M192 166 V186" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <g filter="url(#parallel-soft-shadow)">
    <rect x="126" y="186" width="132" height="44" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="192" y="214" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#3730a3">Findings</text>
  </g>

  <g filter="url(#parallel-soft-shadow)">
    <rect x="462" y="122" width="132" height="44" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="528" y="150" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#0e7490">Analyze</text>
  </g>
  <path d="M528 166 V186" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <g filter="url(#parallel-soft-shadow)">
    <rect x="462" y="186" width="132" height="44" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="528" y="214" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#0e7490">Findings</text>
  </g>

  <path d="M192 230 C220 250 240 262 270 272" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <path d="M528 230 C500 250 480 262 450 272" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <text x="220" y="256" text-anchor="middle" class="label" font-size="9.5" font-weight="500" fill="#64748b">AGREE / RESEVERITY:Pn / DISAGREE</text>
  <text x="500" y="256" text-anchor="middle" class="label" font-size="9.5" font-weight="500" fill="#64748b">AGREE / RESEVERITY:Pn / DISAGREE</text>

  <ellipse cx="360" cy="279" rx="118" ry="48" fill="url(#parallel-hub-glow)"/>
  <g filter="url(#parallel-soft-shadow)">
    <rect x="270" y="252" width="180" height="54" rx="27" fill="#fff7ed" stroke="#f97316" stroke-width="2.4"/>
    <text x="360" y="276" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#9a3412">Cross-challenge</text>
    <text x="360" y="294" text-anchor="middle" class="label" font-size="10.5" font-weight="500" fill="#64748b">Round 1 · Round 2 max</text>
  </g>

  <path d="M360 306 V322" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <g filter="url(#parallel-soft-shadow)">
    <rect x="280" y="322" width="160" height="34" rx="17" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="360" y="344" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#334155">Merge findings</text>
  </g>

  <path d="M440 339 C462 339 478 339 500 339" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6" marker-end="url(#parallel-arrow-red)"/>
  <text x="470" y="329" text-anchor="middle" class="label" font-size="10" font-weight="500" fill="#991b1b">unresolved</text>
  <rect x="500" y="322" width="130" height="34" rx="17" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 5"/>
  <text x="565" y="344" text-anchor="middle" class="label" font-size="12" font-weight="800" fill="#991b1b">Owner decides</text>

  <path d="M360 356 V364" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#parallel-arrow-slate)"/>
  <g filter="url(#parallel-soft-shadow)">
    <rect x="264" y="364" width="192" height="34" rx="17" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="360" y="386" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#166534">Consensus output</text>
  </g>
</svg>
