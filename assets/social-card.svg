<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Claude + Codex Two-LLM Workflow</title>
  <desc id="banner-desc">A social banner summarizing a two-LLM workflow where Claude and Codex cross-check work, with owner approval, linear execution, and parallel challenge modes.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="challengeGrad" x1="846" y1="451" x2="1006" y2="499" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="arrowSlate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 1 L8 4.5 L0 8" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="638" rx="28" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="74" y="54" width="70" height="8" rx="4" fill="#4f46e5" opacity="0.22"/>
  <rect x="154" y="54" width="70" height="8" rx="4" fill="#0891b2" opacity="0.22"/>
  <rect x="234" y="54" width="42" height="8" rx="4" fill="#f97316" opacity="0.25"/>

  <text x="72" y="133" class="label" font-size="74" font-weight="800" fill="#1e1b4b">
    Claude <tspan fill="#64748b">+</tspan> <tspan fill="#164e63">Codex</tspan>
  </text>
  <text x="76" y="181" class="label" font-size="34" font-weight="700" fill="#334155">Two-LLM Workflow</text>
  <text x="76" y="229" class="label" font-size="23" font-weight="500" fill="#475569">Two LLMs cross-check; you only step in for the calls that matter.</text>

  <g filter="url(#softShadow)">
    <rect x="718" y="54" width="486" height="266" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M961 110 C961 136 872 137 852 166" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M961 110 C961 136 1050 137 1070 166" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>

    <rect x="872" y="72" width="178" height="44" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="961" y="101" text-anchor="middle" class="label" font-size="18" font-weight="750" fill="#334155">Owner</text>

    <rect x="758" y="166" width="192" height="80" rx="26" fill="#eef2ff" stroke="#4f46e5" stroke-width="3" filter="url(#nodeShadow)"/>
    <path d="M800 184 L779 196 L779 220 L800 232 L821 220 L821 196 Z" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="800" y="216" text-anchor="middle" class="label" font-size="24" font-weight="800" fill="#4f46e5">C</text>
    <text x="845" y="216" class="label" font-size="27" font-weight="800" fill="#1e1b4b">Claude</text>

    <rect x="972" y="166" width="192" height="80" rx="26" fill="#ecfeff" stroke="#0891b2" stroke-width="3" filter="url(#nodeShadow)"/>
    <path d="M1014 184 L993 196 L993 220 L1014 232 L1035 220 L1035 196 Z" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
    <text x="1014" y="216" text-anchor="middle" class="label" font-size="24" font-weight="800" fill="#0891b2">C</text>
    <text x="1059" y="216" class="label" font-size="27" font-weight="800" fill="#164e63">Codex</text>

    <path d="M940 206 C953 184 981 184 968 206 C955 228 927 228 940 206" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <path d="M982 206 C969 184 941 184 954 206 C967 228 995 228 982 206" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <circle cx="961" cy="206" r="4.5" fill="#f97316"/>
    <text x="961" y="278" text-anchor="middle" class="label" font-size="15" font-weight="650" fill="#64748b">review loop</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="56" y="360" width="552" height="206" rx="22" fill="url(#panelGrad)" stroke="#e2e8f0"/>
    <text x="88" y="405" class="label" font-size="27" font-weight="800" fill="#334155">Mode 1 · Linear</text>

    <line x1="130" y1="464" x2="160" y2="464" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
    <line x1="202" y1="464" x2="232" y2="464" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
    <line x1="274" y1="464" x2="304" y2="464" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
    <line x1="346" y1="464" x2="376" y2="464" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
    <path d="M418 464 C438 464 444 444 462 444" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
    <path d="M418 464 C438 464 444 492 462 492" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>

    <circle cx="106" cy="464" r="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="178" cy="464" r="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
    <circle cx="250" cy="464" r="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
    <circle cx="322" cy="464" r="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
    <circle cx="394" cy="464" r="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>

    <text x="106" y="471" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#334155">P1</text>
    <text x="178" y="471" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#1e1b4b">P2</text>
    <text x="250" y="471" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#164e63">P3</text>
    <text x="322" y="471" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#1e1b4b">P4</text>
    <text x="394" y="471" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#164e63">P5</text>

    <rect x="478" y="426" width="98" height="34" rx="17" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="527" y="449" text-anchor="middle" class="label" font-size="13" font-weight="850" fill="#166534">APPROVE</text>
    <rect x="478" y="476" width="98" height="34" rx="17" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="527" y="499" text-anchor="middle" class="label" font-size="13" font-weight="850" fill="#9a3412">REJECT</text>

    <text x="88" y="533" class="label" font-size="18" font-weight="650" fill="#64748b">dev / fix / known-target</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="672" y="360" width="552" height="206" rx="22" fill="url(#panelGrad)" stroke="#e2e8f0"/>
    <text x="704" y="405" class="label" font-size="27" font-weight="800" fill="#334155">Mode 2 · Parallel</text>

    <rect x="716" y="428" width="98" height="38" rx="19" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.3"/>
    <text x="765" y="453" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#1e1b4b">Claude</text>
    <rect x="716" y="486" width="98" height="38" rx="19" fill="#ecfeff" stroke="#0891b2" stroke-width="2.3"/>
    <text x="765" y="511" text-anchor="middle" class="label" font-size="15" font-weight="800" fill="#164e63">Codex</text>

    <path d="M814 447 C842 447 844 472 872 472" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
    <path d="M814 505 C842 505 844 478 872 478" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowSlate)"/>

    <rect x="860" y="451" width="164" height="50" rx="19" fill="url(#challengeGrad)" stroke="#f97316" stroke-width="2.5"/>
    <text x="942" y="482" text-anchor="middle" class="label" font-size="17" font-weight="850" fill="#9a3412">cross-challenge</text>

    <line x1="1024" y1="476" x2="1060" y2="476" stroke="#16a34a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <rect x="1064" y="451" width="120" height="50" rx="25" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="1124" y="482" text-anchor="middle" class="label" font-size="17" font-weight="850" fill="#166534">consensus</text>

    <text x="704" y="533" class="label" font-size="18" font-weight="650" fill="#64748b">audit / design / brainstorm</text>
  </g>

  <text x="1206" y="610" text-anchor="end" class="label" font-size="16" font-weight="600" fill="#64748b">github.com/zhsongqing/claude-codex-workflow</text>
</svg>