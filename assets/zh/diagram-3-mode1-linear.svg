<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="linear-zh-title linear-zh-desc">
  <title id="linear-zh-title">模式 1 线性流程</title>
  <desc id="linear-zh-desc">五个连续阶段从实施推进到最终评审；APPROVE 后合并，REJECT 返回修复；连续 REJECT 升级给 Owner。</desc>
  <defs>
    <filter id="linear-zh-soft-shadow" x="-18%" y="-25%" width="136%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="linear-zh-arrow-slate" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="linear-zh-arrow-cyan" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="linear-zh-arrow-green" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="linear-zh-arrow-red" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    .label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <rect x="1" y="1" width="718" height="358" rx="24" fill="#ffffff" stroke="#e2e8f0"/>

  <path d="M146 180 H162" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#linear-zh-arrow-slate)"/>
  <path d="M278 180 H292" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#linear-zh-arrow-slate)"/>
  <path d="M408 180 H422" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#linear-zh-arrow-slate)"/>
  <path d="M530 180 H542" fill="none" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" marker-end="url(#linear-zh-arrow-slate)"/>

  <path d="M610 152 C570 86 428 80 350 151" fill="none" stroke="#0891b2" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#linear-zh-arrow-cyan)"/>
  <text x="483" y="94" text-anchor="middle" class="label" font-size="11" font-weight="700" fill="#0891b2">REJECT</text>

  <path d="M610 216 C586 232 508 245 503 286" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#linear-zh-arrow-green)"/>
  <text x="548" y="260" text-anchor="middle" class="label" font-size="11" font-weight="700" fill="#16a34a">APPROVE</text>

  <path d="M676 184 C702 200 704 226 688 247" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6" marker-end="url(#linear-zh-arrow-red)"/>

  <text x="90" y="128" text-anchor="middle" class="label" font-size="42" font-weight="800" fill="#4f46e5" opacity="0.16">1</text>
  <text x="220" y="128" text-anchor="middle" class="label" font-size="42" font-weight="800" fill="#0891b2" opacity="0.16">2</text>
  <text x="350" y="128" text-anchor="middle" class="label" font-size="42" font-weight="800" fill="#4f46e5" opacity="0.16">3</text>
  <text x="476" y="128" text-anchor="middle" class="label" font-size="42" font-weight="800" fill="#94a3b8" opacity="0.18">4</text>
  <text x="610" y="128" text-anchor="middle" class="label" font-size="42" font-weight="800" fill="#f97316" opacity="0.18">5</text>

  <g filter="url(#linear-zh-soft-shadow)">
    <rect x="32" y="152" width="114" height="56" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="89" y="184" text-anchor="middle" class="label" font-size="13" font-weight="700" fill="#3730a3">实施 + 测试</text>
  </g>

  <g filter="url(#linear-zh-soft-shadow)">
    <rect x="162" y="152" width="116" height="56" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="220" y="184" text-anchor="middle" class="label" font-size="13" font-weight="700" fill="#0e7490">Codex 评审</text>
  </g>

  <g filter="url(#linear-zh-soft-shadow)">
    <rect x="292" y="152" width="116" height="56" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="350" y="184" text-anchor="middle" class="label" font-size="13" font-weight="700" fill="#3730a3">修复 + 提 draft PR</text>
  </g>

  <g filter="url(#linear-zh-soft-shadow)">
    <rect x="422" y="152" width="108" height="56" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="476" y="184" text-anchor="middle" class="label" font-size="13" font-weight="700" fill="#334155">CI 通过</text>
  </g>

  <g filter="url(#linear-zh-soft-shadow)">
    <path d="M562 152 H642 Q650 152 656 160 L674 177 Q680 184 674 191 L656 208 Q650 216 642 216 H562 Q554 216 548 208 L530 191 Q524 184 530 177 L548 160 Q554 152 562 152 Z" fill="#ecfeff" stroke="#f97316" stroke-width="2.4"/>
    <text x="610" y="188" text-anchor="middle" class="label" font-size="13" font-weight="800" fill="#0e7490">最终评审</text>
  </g>

  <g filter="url(#linear-zh-soft-shadow)">
    <rect x="382" y="286" width="242" height="44" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="503" y="313" text-anchor="middle" class="label" font-size="14" font-weight="800" fill="#166534">Squash 合并 + 自动部署</text>
  </g>

  <g>
    <rect x="562" y="234" width="126" height="40" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 5"/>
    <text x="625" y="251" text-anchor="middle" class="label" font-size="10" font-weight="600" fill="#991b1b">连续 3 次 REJECT</text>
    <text x="625" y="266" text-anchor="middle" class="label" font-size="10" font-weight="600" fill="#991b1b">升级 Owner</text>
  </g>
</svg>
